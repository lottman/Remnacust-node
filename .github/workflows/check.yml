name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs
      - name: Verify automatic listener replacement and rollback with the published native core
        env:
          REMNACUST_LISTENER_TEST_CORE: ${{ runner.temp }}/remnacust-listener-core
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --max-filesize 201326592 https://github.com/lottman/Remnacust-core/releases/download/v1.1.13/remnacust-core-1.1.13-linux-amd64 -o "$REMNACUST_LISTENER_TEST_CORE"
          printf 'feb6fc7ee252873ed39d89e06711997e9bb4a91ed6adb5db45631b55b5425edb  %s\n' "$REMNACUST_LISTENER_TEST_CORE" | sha256sum -c
          chmod 755 "$REMNACUST_LISTENER_TEST_CORE"
          node --test tests/runtime-listener-process.test.cjs
      - run: npm run build
