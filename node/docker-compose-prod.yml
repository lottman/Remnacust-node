services:
  remnanode:
    image: remnacust-node:1.1.1
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    container_name: remnanode
    hostname: remnanode
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - NODE_PORT=${NODE_PORT:-2222}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY from the panel}
